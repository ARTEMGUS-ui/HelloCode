<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Code</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="form">
        <h1 class="headr">Переменные и типы данных</h1>
        
        <div class="contain">
            <p class="gl">Ты узнаешь:</p>
            <ul class="list">
                <li>Что такое переменная?</li>
                <li>Какие типы переменных бывают?</li>
                <li>Зачем они нужны на примере</li>
            </ul>
        </div>

        <div class="strt">
            <button class="open-course" id="1-cs">Начать</button>
            <span class="episode">0/3</span>
        </div>
    </main>

    <nav class="menu">
        <a href="index.html" class="cont">
            <img src="data/Learn.png" alt="Познай">
            <p>Познай</p>
        </a>
        <a href="settings.html" class="cont">
            <img src="data/Setting.png" alt="Настройки">
            <p>Настройки</p>
        </a>
    </nav>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }

        const progress = localStorage.getItem('userProgress') || '0';
        document.querySelector('.episode').textContent = `${progress}/3`;

        const startBtn = document.getElementById('1-cs');
        if (progress === '3') {
            startBtn.textContent = "Пройти заново";
            localStorage.setItem('currentLesson', '1');
            startBtn.addEventListener('click', () => {
                localStorage.setItem('userProgress', '0');
                window.location.href = 'lesson.html';
            });
        } else {
            if (parseInt(progress) > 0) {
                startBtn.textContent = "Продолжить";
            }
            startBtn.addEventListener('click', () => {
                window.location.href = 'lesson.html';
            });
        }
    </script>
</body>
</html>

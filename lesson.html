<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Code — Урок</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="form lesson-form">
        <div class="lesson-header">
            <a href="index.html" class="back-btn">←</a>
            <h1 class="headr" id="lesson-title">Загрузка...</h1>
            <span class="episode" id="lesson-progress">1/3</span>
        </div>
        
        <div class="contain" id="lesson-content">
            <p class="gl" id="section-title">Объяснение:</p>
            <div class="theory-text" id="theory-text">...</div>
            
            <p class="gl">Пример в коде:</p>
            <pre class="code-block"><code id="code-example">...</code></pre>
        </div>

        <div class="quiz-container" id="quiz-container">
            <p class="gl">Игровое задание:</p>
            <p class="quiz-question" id="quiz-question">...</p>
            <div class="quiz-options" id="quiz-options"></div>
            <p class="quiz-feedback" id="quiz-feedback"></p>
        </div>

        <div class="strt">
            <button class="open-course" id="next-btn" disabled>Проверить</button>
        </div>
    </main>

    <div class="modal-overlay" id="victory-modal">
        <div class="modal-card">
            <p class="modal-text">🎉 Поздравляем! Ты полностью прошёл образовательный маршрут по переменным!</p>
            <div class="modal-actions">
                <button class="modal-btn confirm-action" onclick="window.location.href='index.html'">На главную</button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const lessonsData = {
            1: {
                title: "Что такое переменная?",
                theory: "Представь коробку, на которую ты наклеил надпись <b>коробка_для_игрушек</b> и положил туда робота. Переменная — это и есть такая коробка с именем в памяти компьютера, где хранится информация!",
                example: "let box = 'робот';\n// Создали коробку и положили робота",
                question: "Какое значение сейчас лежит в переменной box?",
                options: ["'коробка'", "'робот'", "ничего", "ошибка"],
                correct: 1
            },
            2: {
                title: "Типы данных: Текст и Числа",
                theory: "В коробки можно класть разные вещи. Числа (числовой тип) пишутся просто так, а текст (строковый тип) — всегда берется в 'кавычки', чтобы компьютер не перепутал его с командами.",
                example: "let age = 15; // Число\nlet name = 'Алекс'; // Текст",
                question: "Как правильно создать текстовую переменную для хранения названия игры?",
                options: ["let game = Minecraft;", "let game = 'Minecraft';", "game = Minecraft", "let 'game' = Minecraft"],
                correct: 1
            },
            3: {
                title: "Зачем они нужны?",
                theory: "Переменные нужны, чтобы менять состояние игры! Например, когда твой персонаж собирает монеты, компьютер берёт текущее значение коробки со счетом и прибавляет к нему единицу.",
                example: "let coins = 0;\ncoins = coins + 1; // Теперь монет: 1",
                question: "Сколько монет будет в переменной coins после этого кода: let coins = 5; coins = coins + 2;",
                options: ["5", "2", "7", "52"],
                correct: 2
            }
        };

        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');

        let currentLesson = parseInt(localStorage.getItem('currentLesson') || '1');
        if (currentLesson > 3) currentLesson = 1;

        const data = lessonsData[currentLesson];

        document.getElementById('lesson-title').textContent = data.title;
        document.getElementById('lesson-progress').textContent = `${currentLesson}/3`;
        document.getElementById('theory-text').innerHTML = data.theory;
        document.getElementById('code-example').textContent = data.example;
        document.getElementById('quiz-question').textContent = data.question;

        const optionsContainer = document.getElementById('quiz-options');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('quiz-feedback');
        let selectedOption = null;
        let isAnswered = false;

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } else if (type === 'wrong') {
                osc.frequency.setValueAtTime(196.00, ctx.currentTime);
                osc.frequency.setValueAtTime(146.83, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        data.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-opt-btn';
            btn.textContent = option;
            btn.addEventListener('click', () => {
                if (isAnswered) return;
                document.querySelectorAll('.quiz-opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedOption = index;
                nextBtn.disabled = false;
            });
            optionsContainer.appendChild(btn);
        });

        nextBtn.addEventListener('click', () => {
            if (!isAnswered) {
                isAnswered = true;
                const buttons = document.querySelectorAll('.quiz-opt-btn');
                
                if (selectedOption === data.correct) {
                    buttons[selectedOption].classList.add('correct');
                    feedback.textContent = "🎯 Великолепно! Правильный ответ!";
                    feedback.style.color = "#00CC66";
                    nextBtn.textContent = "Дальше";
                    playSound('correct');
                } else {
                    buttons[selectedOption].classList.add('wrong');
                    buttons[data.correct].classList.add('correct');
                    feedback.textContent = "Упс! Попробуй перечитать пример.";
                    feedback.style.color = "#FF3333";
                    nextBtn.textContent = "Повторить урок";
                    playSound('wrong');
                }
            } else {
                if (selectedOption === data.correct) {
                    if (currentLesson < 3) {
                        localStorage.setItem('currentLesson', currentLesson + 1);
                        localStorage.setItem('userProgress', currentLesson);
                        window.location.reload();
                    } else {
                        localStorage.setItem('userProgress', '3');
                        document.getElementById('victory-modal').classList.add('active');
                        startConfetti();
                    }
                } else {
                    window.location.reload();
                }
            }
        });

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.display = 'block';

            let particles = [];
            const colors = ['#B21EE3', '#00FF66', '#FF3333', '#00CC66', '#FFFF00'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, idx) => {
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();

                    p.y += Math.cos(p.d) + 2 + p.r / 2;
                    p.tilt = Math.sin(p.d - idx);

                    if (p.y > canvas.height) {
                        particles[idx] = {
                            x: Math.random() * canvas.width,
                            y: -20,
                            r: p.r,
                            d: p.d,
                            color: p.color,
                            tilt: p.tilt
                        };
                    }
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
